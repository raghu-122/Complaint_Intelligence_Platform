categories:
  - id: 1
    code: "DELIVERY_DELAY"
    name: "Delivery Delay"
    description: "Complaints about delayed or late deliveries"
    keywords:
      - "late"
      - "delay"
      - "delayed"
      - "shipping"
      - "not arrived"
      - "overdue"
      - "waiting"
      - "where is my order"
      - "slow delivery"
      - "delivery time"
      - "not delivered"
      - "tracking"
      - "expected delivery"
    safety_risk: false

  - id: 2
    code: "DAMAGED_PRODUCT"
    name: "Damaged Product"
    description: "Complaints about products received in damaged condition"
    keywords:
      - "damaged"
      - "broken"
      - "cracked"
      - "dented"
      - "smashed"
      - "shattered"
      - "crushed"
      - "arrived broken"
      - "package damaged"
      - "defective on arrival"
      - "bent"
      - "torn"
    safety_risk: false

  - id: 3
    code: "PRODUCT_SAFETY"
    name: "Product Safety"
    description: "Complaints about product safety risks, injuries, or hazards"
    keywords:
      - "safety"
      - "unsafe"
      - "hazard"
      - "dangerous"
      - "injury"
      - "injured"
      - "hurt"
      - "burn"
      - "fire"
      - "electric shock"
      - "recall"
      - "toxic"
      - "poisonous"
      - "health risk"
      - "exploded"
      - "smoke"
      - "sparks"
      - "overheating"
    safety_risk: true

  - id: 4
    code: "REFUND"
    name: "Refund"
    description: "Complaints requesting refunds or reimbursements"
    keywords:
